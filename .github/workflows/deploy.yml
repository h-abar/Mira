name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "::error::RAILWAY_TOKEN secret is missing! Add it in Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.RAILWAY_PROJECT_ID }}" ]; then
            echo "::error::RAILWAY_PROJECT_ID secret is missing! Add it in Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "${{ secrets.RAILWAY_SERVICE_ID }}" ]; then
            echo "::error::RAILWAY_SERVICE_ID secret is missing! Add it in Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "All Railway secrets are present."

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Link and deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          echo "Linking to Railway project/service..."
          railway link --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID"
          echo "Deploying to Railway..."
          railway up --detach
          echo "Deployment triggered successfully."
